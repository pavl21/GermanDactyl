# .github/workflows/verify-patches.yml
# Zwei Prüfungen:
#   1. verify:        Alle Patches stehen in der signierten Prüfsummenliste und die Signatur passt zum
#                     Schlüssel in scripts/install.sh. Ohne das würde der Installer nach einem Merge jede
#                     Installation ablehnen.
#   2. patch-upstream: Jeder Patch lässt sich auf das passende Upstream-Release anwenden (git apply --check
#                     mit denselben Optionen wie install.sh) und die geänderten PHP-Dateien sind syntaktisch
#                     gültig (php -l). So fällt ein Patch, der nicht mehr zu seiner Panel-Version passt oder
#                     ein PHP-Skript zerschießt, schon im Pull Request auf – nicht erst bei der Installation.
name: Patches prüfen

on:
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/install.sh'
      - '.github/workflows/verify-patches.yml'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/install.sh'
      - '.github/workflows/verify-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Signatur und Prüfsummen prüfen
        run: |
          set -euo pipefail
          fpr=$(sed -n 's/^readonly SIGNING_KEY_FPR="\(.*\)"$/\1/p' scripts/install.sh)
          b64=$(sed -n 's/^readonly SIGNING_KEY_B64="\(.*\)"$/\1/p' scripts/install.sh)
          if [[ ! $fpr =~ ^[0-9A-F]{40}$ ]] || [[ -z $b64 || $b64 == __* ]]; then
            echo "::error file=scripts/install.sh::Kein Signaturschlüssel in install.sh hinterlegt."
            exit 1
          fi

          work=$(mktemp -d)
          mkdir -m 700 "$work/gnupg"
          printf '%s' "$b64" | base64 -d >"$work/key.gpg"
          gpgv --homedir "$work/gnupg" --keyring "$work/key.gpg" --status-fd 3 \
            patches/SHA256SUMS.asc patches/SHA256SUMS 3>"$work/status"
          grep -Eq "^\[GNUPG:\] VALIDSIG .*\b$fpr\b" "$work/status" \
            || { echo "::error file=patches/SHA256SUMS.asc::Signatur stammt nicht vom Schlüssel $fpr."; exit 1; }

          cd patches
          sha256sum --strict -c SHA256SUMS
          for patch in v*.patch; do
            grep -q "  $patch\$" SHA256SUMS \
              || { echo "::error file=patches/$patch::$patch fehlt in SHA256SUMS. Signiere mit ./scripts/createPatch.sh --sign"; exit 1; }
          done
          echo "Alle Patches sind signiert und unverändert."

  patch-upstream:
    name: Patches gegen Upstream prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PHP-Version anzeigen
        run: php --version

      - name: Jeden Patch gegen sein Upstream-Release prüfen
        run: |
          set -euo pipefail
          repo_root=$PWD
          work=$(mktemp -d)
          failed=()

          # Dieselben Optionen wie APPLY_OPTS in scripts/install.sh (Whitespace tolerant, nur erlaubte Pfade)
          apply_opts=(--ignore-whitespace --ignore-space-change)
          for dir in app resources public database routes config; do
            apply_opts+=("--include=$dir/*")
          done

          shopt -s nullglob
          patches=(patches/v*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::Keine Patches in patches/ gefunden."
            exit 1
          fi

          for patch in "${patches[@]}"; do
            name=$(basename "$patch" .patch)   # z. B. v1.15.1
            echo "::group::$name"
            panel="$work/$name"
            ok=true

            # Das Upstream-Release holen (flacher Klon des Tags)
            if ! git clone --quiet -c advice.detachedHead=false --depth 1 --branch "$name" https://github.com/pterodactyl/panel.git "$panel"; then
              echo "::error file=$patch::Tag $name konnte nicht aus pterodactyl/panel geholt werden."
              ok=false
            else
              cd "$panel"
              # 1. Lässt sich der Patch anwenden?
              if ! git apply "${apply_opts[@]}" --check "$repo_root/$patch"; then
                echo "::error file=$patch::$patch lässt sich nicht auf pterodactyl/panel $name anwenden (git apply --check)."
                ok=false
              elif ! git apply "${apply_opts[@]}" "$repo_root/$patch"; then
                echo "::error file=$patch::$patch konnte nicht angewendet werden."
                ok=false
              else
                # 2. Sind alle geänderten PHP-Dateien syntaktisch gültig?
                count=0
                while IFS= read -r file; do
                  [ -f "$file" ] || continue   # vom Patch gelöschte Dateien überspringen
                  count=$((count + 1))
                  if ! out=$(php -l "$file" 2>&1); then
                    echo "$out"
                    echo "::error file=$patch::PHP-Syntaxfehler in $file ($name)."
                    ok=false
                  fi
                done < <(git apply "${apply_opts[@]}" --numstat "$repo_root/$patch" | cut -f3- | grep -E '\.php$' || true)
                echo "$count PHP-Dateien mit php -l geprüft."
              fi
              cd "$repo_root"
            fi

            $ok && echo "$name: OK" || failed+=("$name")
            echo "::endgroup::"
            rm -rf "$panel"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Fehlgeschlagen: ${failed[*]}"
            exit 1
          fi
          echo "Alle ${#patches[@]} Patches passen auf ihr Upstream-Release."
